/* UnitAi identity: a connected U, precise typography, mint on ink. */
:root{--bg:#090e12;--surface:#10181e;--line:#263239;--text:#f1f5ef;--dim:#a1afb3;--accent:#83f3c4;--signal:#83f3c4}
body{background:radial-gradient(ellipse at 86% 5%,#15352c66,transparent 30%),var(--bg);font-family:Inter,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1280px;padding:0 40px}
nav{min-height:100px;border-bottom:1px solid var(--line);gap:28px}
.logo{display:flex;align-items:center;gap:11px;font-size:29px;letter-spacing:-1.4px;font-weight:750}.logo svg{width:38px;height:38px}.logo span{color:var(--text)}.logo em{font-style:normal;color:var(--accent);font-weight:450}
.links{gap:23px}.links a{transition:color .2s}.links a:hover{color:var(--accent)}
select{border-radius:24px;padding:9px 13px;font-size:13px;background:#10191c}
.hero{min-height:680px;padding:90px 0 105px;gap:50px;grid-template-columns:1.15fr 1fr}
.eyebrow{font:600 11px/1.6 "Segoe UI",sans-serif;letter-spacing:.16em}
h1{font-size:clamp(40px,4.5vw,66px);line-height:1.07;letter-spacing:-.055em;font-weight:650;max-width:740px}
.hero p{font-size:17px;max-width:580px;line-height:1.8}

.hero-art:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#83f3c409 1px,transparent 1px),linear-gradient(90deg,#83f3c409 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(ellipse,black,transparent 75%);pointer-events:none}
.hero-art .status{position:relative;z-index:1;font:11px "Segoe UI",sans-serif}
.identity-orbit{position:relative;display:flex;align-items:center;justify-content:center;height:76%;min-height:240px}
.orbit-ring{position:absolute;border:1px solid #83f3c42b;border-radius:50%;width:88%;aspect-ratio:1;transform:rotate(-25deg) scaleY(.72)}
.orbit-ring.two{width:72%;transform:rotate(40deg) scaleY(.85);border-style:dashed}
.orbit-ring:after{content:"";position:absolute;left:12%;top:12%;width:9px;height:9px;background:var(--accent);border-radius:50%;box-shadow:0 0 20px #83f3c4}

nsoren","Wissen & Dokumentation"],"capText":["Datenblätter, C/C++, Treiber, STM32, ESP32, nRF52, FreeRTOS und Zephyr.","Protokolle, Build-Fehler, Regressionstests und überprüfbare Änderungen.","Kamerapipelines, Objekterkennung und Inferenz auf dem Gerät.","Recherche in technischen Dokumenten, belegte Antworten und Übergabenotizen."],"stack":"Technische Bausteine","contact":"Hast du einen Workflow im Kopf?","contactText":"Unabhängige Arbeit an eingebetteten Systemen, IoT und lokaler KI aus Izmir, Türkei. Erzähle mir, welche Aufgabe du vereinfachen möchtest.","cta":"Projekt besprechen","footer":"Ideen erkunden. Praktische Lösungen entwickeln.","disclaimer":"Lokale Inferenz bedeutet nicht, dass alle Werkzeuge offline arbeiten. Suche, Karten und E-Mail können externe Dienste nutzen. Referenzen zeigen Inspiration, keine Integration oder Partnerschaft.","sourceLabel":"Quellprojekt ansehen","lang":"Sprache","selectHint":"Wähle oben einen Bereich aus, um die Projekte zu sehen.","privacy":"Diese Seite stellt Projektideen vor. Sie erfasst keine Gesundheitsdaten, greift nicht auf Karten zu und versendet keine E-Mails.","m":["Lokale Agenten für deine Arbeit.","UnitAi MVP","In Entwicklung","Ein lokal feinabgestimmter Agent für bestimmte berufliche Aufgaben. Ziel sind Aufgaben größerer Modelle mit geringeren Tokenkosten, kontrolliertem Datenzugriff und einem prüfbaren Agentenzyklus. Diese Ziele wurden noch nicht durch Benchmarks bestätigt.","Sprachbefehle","Bildschirminhalte verstehen","Zugriff mit Berechtigung","Aufgabe sprechen und die erkannte Anfrage prüfen.","Einen ausgewählten Bildschirm oder ein Fenster als Kontext teilen.","Festlegen, auf welche Dateien und Werkzeuge der Agent zugreifen darf.","Anfrage → Plan → Aktion → Prüfung → Weiter","Illustrative Produktvorschau. Hier wird kein Zugriff auf Mikrofon, Bildschirm oder Dateien angefordert.","MVP besprechen","Produkt","Eine eigene Domain ist geplant. Die lokale Laufzeit bleibt eine separate Komponente mit ausdrücklichen Berechtigungen."]},"ru":{"nav":["Как это работает","Проекты","Возможности","Контакты"],"eyebrow":"ЛОКАЛЬНЫЙ ИИ · АВТОМАТИЗАЦИЯ ЗАДАЧ","headline":"Ваши инструменты. Ваше оборудование.<br>Агенты работают вместе.","lede":"UnitAI исследует, как специализированные локальные модели могут помогать в разработке встраиваемых систем и повседневной работе бизнеса. Начните с задачи, подключите нужные инструменты и оцените результат.","explore":"Посмотреть идеи проектов","github":"Проекты на GitHub","chips":["Локальный запуск моделей","Инструменты в рабочих процессах","Проверка человеком"],"how":"Как это работает","howTitle":"От запроса к полезному результату.","steps":["Собрать контекст","Составить план","Использовать инструменты","Проверить результат"],"stepText":["Собрать нужные документы, измерения или сведения о компании.","Разделить задачу на шаги и выбрать подходящих специалистов.","Найти источники, выполнить проверки и подготовить результат.","Показать источники и неопределённости, чтобы человек мог принять решение."],"projects":"КАТАЛОГ ПРОЕКТОВ","projectTitle":"Что вы хотите улучшить?","projectIntro":"Выберите направление и изучите идеи проектов со схемами. Это предлагаемые процессы, а не действующие сервисы UnitAI.","questions":["Как развивать свой локальный бизнес?","Как агенты могут помочь инженерной команде?","Как поддержать профилактическую медицину?"],"qdesc":["Поиск компаний, коммуникация, поддержка и операции.","Исследования, программирование и технические знания.","Данные с согласия участников, тенденции и врачебная оценка."],"category":["Локальный бизнес","Инженерия","Профилактика"],"projectCount":"идей проектов","details":"Подробнее о проекте","input":"Исходные данные","flow":"Работа агента","output":"Результат","note":"Перед реальным применением","reference":"Источник идеи","concept":"КОНЦЕПЦИЯ ПРОЕКТА","back":"Выбрать другое направление","capTitle":"Встраиваемые системы и локальный ИИ.","capDesc":"Небольшие специализированные модели работают с инструментами и источниками, необходимыми для каждой задачи.","caps":["Аппаратная часть и прошивки","Отладка и тестирование","Зрение и датчики","Знания и документация"],"capText":["Документация компонентов, C/C++, драйверы, STM32, ESP32, nRF52, FreeRTOS и Zephyr.","Журналы, ошибки сборки, регрессионные проверки и изменения для ревью.","Работа с камерами, распознавание объектов и вычисления на устройстве.","Поиск в технических документах, ответы с источниками и передача знаний."],"stack":"Технические компоненты","contact":"Есть задача для автоматизации?","contactText":"Независимые проекты в области встраиваемых систем, IoT и локального ИИ. Измир, Турция. Расскажите, какую задачу вы хотите упростить.","cta":"Обсудить проект","footer":"Исследуем идеи. Создаём полезные решения.","disclaimer":"Локальные вычисления не означают, что все инструменты работают офлайн. Поиск, карты и почта могут обращаться к внешним сервисам. Ссылки — источники вдохновения, а не подтверждение интеграции или партнёрства.","sourceLabel":"Открыть исходный проект","lang":"Язык","selectHint":"Выберите направление выше, чтобы увидеть проекты.","privacy":"На этой странице представлены идеи проектов. Она не собирает медицинские данные, не обращается к картам и не отправляет письма.","m":["Локальные агенты для ваших задач.","UnitAi MVP","В разработке","Локально дообученный агент для специализированных задач. Цель — выполнять работу больших моделей с меньшими затратами на токены, контролируемым доступом и проверяемым циклом действий. Эти цели пока не подтверждены сравнительными тестами.","Голосовые команды","Понимание экрана","Доступ с разрешения","Озвучьте задачу и проверьте распознанный запрос.","Поделитесь выбранным экраном или окном для контекста.","Выберите доступные агенту файлы и инструменты.","Запрос → План → Действие → Проверка → Продолжение","Иллюстрация будущего продукта. Здесь не запрашивается доступ к микрофону, экрану или файлам.","Обсудить MVP","Продукт","Планируется собственный домен. Локальная среда останется отдельным компонентом с явными разрешениями."]}};
const P=[{"id":"pcb-cost-down","cat":1,"icon":"pcb","source":["Ansys PyAEDT / PyEDB","https://aedt.docs.pyansys.com/"],"texts":{"en":["PCB Cost-Down Agent","Explore a lower-cost PCB and BOM while preserving the product's electrical, thermal, environmental, and manufacturing requirements.","Gerber and drill files, editable PCB and schematic, netlist, BOM, stack-up/materials, design rules, test results, operating climate, mission profile, target quantity, and cost baseline.",["Establish the baseline: inspect fabrication data and connectivity, flag missing inputs, and map board, assembly, component, and qualification costs.","Investigate root causes: connect field failures and test logs to design hypotheses. Use measurements and targeted simulations to test explanations rather than declare an unverified cause.","Automate analysis where supported: prepare approved Ansys EDB models and HFSS 3D Layout, SIwave, or thermal workflows through compatible APIs. Record solver versions, boundary conditions, convergence, assumptions, and results.","Evaluate 6 → 4 layers: propose a stack-up and revised placement/routing in supported EDA tools. Check return paths, impedance, crosstalk, power integrity, thermal limits, isolation, routing capacity, and fabrication rules. Retain six layers when requirements cannot be met.","Search alternatives: compare manufacturer datasheets and authorized supplier listings against recommended operating ranges, derating, transient stresses, temperature, humidity, altitude, lifetime, footprint, interfaces, and qualification requirements.","Compare complete costs: include quantity price breaks, stock, MOQ, lead time, tooling, assembly, redesign, and requalification. Flag uncertain prices and record their retrieval dates.","Request quotations after approval: show the engineer the proposed design/BOM, recipient list, shared files, and quantities. Only then send RFQs through an authorized integration; compare returned quotes without placing an order.","Close the validation loop: issue a reviewable candidate layout/BOM and analysis report, then schedule prototype, environmental, EMC, and functional validation before production release."],"An engineering change proposal, candidate 4-layer layout if feasible, alternative BOM, simulation evidence, risk register, and quantity-based RFQ comparison. No savings are claimed until quotes and validation support them.","Concept in development. Gerber alone does not reliably restore design intent or complete simulation inputs. Ansys and EDA integrations require compatible installed tools, licenses, models, and engineering setup; automation is not an autonomous sign-off. Staying below absolute maximum ratings is not sufficient: operating limits, derating, transients, and reliability must also pass."],"tr":["PCB Cost-Down Agent","Ürünün elektriksel, termal, çevresel ve üretim gereksinimlerini koruyarak daha düşük maliyetli PCB ve malzeme listesi seçeneklerini araştır.","Gerber ve delik dosyaları, düzenlenebilir PCB ve şema, netlist, BOM, katman yapısı ve malzemeler, tasarım kuralları, test sonuçları, kullanım iklimi, çalışma profili, hedef adet ve mevcut maliyet.",["Başlangıç durumunu belirle: üretim verilerini ve bağlantıları incele, eksik girdileri işaretle; kart, montaj, komponent ve doğrulama maliyetlerini çıkar.","Kök nedenleri araştır: saha hatalarını ve test kayıtlarını tasarım hipotezleriyle ilişkilendir. Ölçüm ve hedefli simülasyonlarla nedenleri test et; doğrulanmamış bir nedeni kesin sonuç olarak sunma.","Desteklenen analizleri otomatikleştir: uyumlu API'lerle Ansys EDB modellerini, HFSS 3D Layout, SIwave veya termal analiz akışlarını hazırla. Çözücü sürümünü, sınır koşullarını, yakınsamayı, varsayımları ve sonuçları kaydet.","6 → 4 katman seçeneğini değerlendir: desteklenen EDA araçlarında katman yapısı, yerleşim ve bağlantı yolları öner. Dönüş yollarını, empedansı, çapraz konuşmayı, güç bütünlüğünü, termal sınırları, izolasyonu, yönlendirme kapasitesini ve üretim kurallarını kontrol et. Gereksinimler karşılanamıyorsa altı katmanı koru.","Alternatif komponent ara: üretici veri sayfaları ve yetkili tedarikçi kayıtlarını önerilen çalışma aralıkları, derating, geçici zorlanmalar, sıcaklık, nem, rakım, ömür, ayak izi, arayüzler ve kalifikasyon şartlarıyla karşılaştır.","Toplam maliyeti karşılaştır: adet bazlı fiyat, stok, minimum sipariş, teslim süresi, kalıp/hazırlık, montaj, yeniden tasarım ve yeniden doğrulamayı dahil et. Belirsiz fiyatları ve erişim tarihlerini göster.","Onaydan sonra teklif iste: tasarım/BOM önerisini, alıcı listesini, paylaşılacak dosyaları ve adetleri mühendise göster. Yalnızca onaydan sonra yetkili entegrasyonla RFQ gönder; gelen teklifleri sipariş vermeden karşılaştır.","Doğrulama döngüsünü tamamla: incelenebilir tasarım/BOM adayı ve analiz raporu hazırla; üretim yayını öncesinde prototip, çevresel, EMC ve fonksiyon testlerini planla."],"Mühendislik değişiklik önerisi, mümkünse dört katmanlı tasarım adayı, alternatif BOM, simülasyon kanıtları, risk listesi ve adet bazlı teklif karşılaştırması. Tasarruf ancak teklifler ve doğrulamalarla desteklenirse belirtilir.","Geliştirme aşamasındaki proje fikri. Gerber tek başına tasarım niyetini veya bütün simülasyon girdilerini güvenilir biçimde geri getirmez. Ansys ve EDA otomasyonu uyumlu kurulum, lisans, model ve mühendislik hazırlığı gerektirir; kendi başına tasarım onayı vermez. Mutlak maksimumların altında kalmak yetmez: çalışma sınırları, derating, geçici durumlar ve güvenilirlik de doğrulanmalıdır."],"de":["PCB Cost-Down Agent","Kostengünstigere Leiterplatten und Stücklisten untersuchen, ohne elektrische, thermische, umweltbezogene oder fertigungstechnische Anforderungen zu verletzen.","Gerber- und Bohrdaten, editierbares PCB und Schaltplan, Netzliste, Stückliste, Lagenaufbau, Materialien, Regeln, Testergebnisse, Einsatzklima, Lastprofil, Stückzahl und Ausgangskosten.",["Ausgangslage erfassen: Fertigungsdaten und Verbindungen prüfen, fehlende Eingaben markieren und Leiterplatten-, Montage-, Bauteil- und Qualifizierungskosten erfassen.","Ursachen untersuchen: Feldausfälle und Testprotokolle mit Designhypothesen verbinden. Vermutungen durch Messungen und gezielte Simulationen prüfen.","Analysen automatisieren: freigegebene EDB-Modelle und HFSS-3D-Layout-, SIwave- oder thermische Workflows über kompatible APIs vorbereiten. Solverversion, Randbedingungen, Konvergenz und Annahmen dokumentieren.","6 → 4 Lagen bewerten: Lagenaufbau und überarbeitetes Layout in unterstützten EDA-Werkzeugen vorschlagen. Rückstrompfade, Impedanz, Übersprechen, Versorgungsintegrität, Temperatur, Isolation und Fertigungsregeln prüfen. Bei Nichterfüllung sechs Lagen beibehalten.","Alternativen suchen: Herstellerdaten und autorisierte Lieferanten anhand von Betriebsbereichen, Derating, Transienten, Temperatur, Feuchte, Höhe, Lebensdauer, Footprint und Qualifikation vergleichen.","Gesamtkosten vergleichen: Mengenpreise, Lagerbestand, Mindestbestellmenge, Lieferzeit, Werkzeuge, Montage, Neuentwicklung und erneute Qualifizierung berücksichtigen. Preisunsicherheit und Abrufdatum angeben.","Nach Freigabe Angebote anfordern: Entwurf, Stückliste, Empfänger, freizugebende Dateien und Mengen zur Prüfung vorlegen. Erst danach autorisierte Angebotsanfragen senden; keine Bestellung auslösen.","Validierung abschließen: prüfbaren Layoutvorschlag und Bericht erstellen. Prototypen-, Umwelt-, EMV- und Funktionstests vor Serienfreigabe planen."],"Änderungsvorschlag, wenn möglich ein Vierlagenlayout, alternative Stückliste, Simulationsnachweise, Risikoliste und mengenbezogener Angebotsvergleich. Einsparungen erst nach belegter Kalkulation und Validierung ausweisen.","Konzept in Entwicklung. Gerber allein liefert nicht zuverlässig die vollständige Designabsicht oder alle Simulationseingaben. Ansys und EDA benötigen kompatible Werkzeuge, Lizenzen, Modelle und fachliche Einrichtung. Absolute Grenzwerte allein reichen nicht: Betriebsgrenzen, Derating, Transienten und Zuverlässigkeit müssen ebenfalls geprüft werden."],"ru":["PCB Cost-Down Agent","Исследовать снижение стоимости платы и компонентов с сохранением электрических, тепловых, климатических и производственных требований.","Gerber, файлы сверловки, редактируемая плата и схема, список соединений, BOM, стек слоёв, материалы, правила, результаты тестов, климат, профиль эксплуатации, количество и исходная стоимость.",["Определить исходное состояние: проверить производственные данные и соединения, отметить недостающие сведения и затраты на плату, монтаж, компоненты и квалификацию.","Исследовать первопричины: сопоставить отказы и журналы испытаний с гипотезами. Проверять причины измерениями и моделированием, не выдавая предположения за доказанные выводы.","Автоматизировать анализ: подготовить согласованные модели EDB и расчёты HFSS 3D Layout, SIwave или тепловые расчёты через совместимые API. Сохранить версии, граничные условия, сходимость и допущения.","Проверить переход 6 → 4 слоя: предложить стек и обновлённую трассировку в поддерживаемой САПР. Проверить обратные токи, импеданс, перекрёстные помехи, питание, тепло, изоляцию и технологические правила. Сохранить шесть слоёв, если требования не выполняются.","Найти альтернативы: сравнить документацию производителей и предложения авторизованных поставщиков по рабочим диапазонам, снижению нагрузки, переходным процессам, температуре, влажности, высоте, ресурсу, корпусу и квалификации.","Сравнить полную стоимость: учесть объём, наличие, минимальный заказ, сроки, оснастку, монтаж, переработку и повторную квалификацию. Указать дату и неопределённость цен.","Запросить предложения после одобрения: показать проект, BOM, адресатов, передаваемые файлы и количество. Только после согласования отправить RFQ через разрешённую интеграцию; сравнить ответы без оформления заказа.","Завершить проверку: подготовить проект изменений и отчёт. До запуска в производство запланировать испытания прототипа, климатические, ЭМС и функциональные проверки."],"Предложение изменений, четырёхслойный вариант при технической возможности, альтернативный BOM, расчёты, реестр рисков и сравнение цен по объёму. Экономия заявляется только после подтверждения расчётами и проверками.","Концепция в разработке. Одних Gerber недостаточно для надёжного восстановления замысла и всех исходных данных. Автоматизация Ansys и САПР требует совместимых программ, лицензий, моделей и инженерной настройки. Недостаточно не превышать абсолютные максимумы: нужны рабочие пределы, запас, переходные режимы и проверка надёжности."]}},{"id":"discovery","cat":0,"icon":"map","source":["Local Deep Researcher","https://github.com/langchain-ai/local-deep-researcher"],"texts":{"en":["Find your next business match","Discover relevant customers and service partners in your area.","An area, business category, and your offer.",["Search public listings","Check business websites","Explain each match"],"A sourced shortlist with reasons to reach out.","Use permitted Maps integrations or supplied directories. No private location or search histories. Web lookups require internet access."],"tr":["İşletmene uygun müşterileri bul","Bölgendeki potansiyel müşterileri ve hizmet ortaklarını keşfet.","Bölge, işletme kategorisi ve sunduğun hizmet.",["Açık işletme kayıtlarını ara","İşletme sitelerini incele","Eşleşmeleri gerekçelendir"],"Kaynakları ve iletişim gerekçeleriyle bir aday listesi.","İzinli harita entegrasyonları veya sağlanan dizinler kullanılır. Kişilerin özel konum ve arama geçmişleri kullanılmaz. Web araması internet gerektirir."],"de":["Passende Geschäftskontakte finden","Entdecke potenzielle Kunden und Dienstleistungspartner in deiner Region.","Region, Unternehmenskategorie und dein Angebot.",["Öffentliche Einträge suchen","Websites prüfen","Passung begründen"],"Eine Kandidatenliste mit Quellen und Kontaktgründen.","Zulässige Kartenintegrationen oder bereitgestellte Verzeichnisse verwenden. Keine privaten Standort- oder Suchverläufe. Webrecherche benötigt Internet."],"ru":["Найти подходящие компании","Поиск потенциальных клиентов и партнёров в вашем регионе.","Регион, категория компаний и ваше предложение.",["Найти публичные записи","Проверить сайты компаний","Объяснить соответствие"],"Список компаний с источниками и причинами для контакта.","Разрешённые интеграции карт или предоставленные каталоги. Без личной истории поиска и перемещений. Поиск в интернете требует подключения."]}},{"id":"outreach","cat":0,"icon":"mail","texts":{"en":["Make outreach relevant","Turn a verified business match into a useful introduction.","An approved contact list and your service information.",["Read business context","Draft a tailored email","Review before sending"],"Personalized email drafts and a follow-up log.","Send only through an authorized integration after approval. Track opt-outs and verify contact details."],"tr":["İletişimi daha anlamlı kur","Doğrulanmış işletme eşleşmelerini yararlı tanışma mesajlarına dönüştür.","Onaylı iletişim listesi ve hizmet bilgilerin.",["İşletme bağlamını oku","Özel e-posta taslağı hazırla","Göndermeden önce incele"],"Kişiselleştirilmiş e-posta taslakları ve takip kaydı.","Gönderim, onaydan sonra yetkili entegrasyonla yapılır. İletişim bilgileri doğrulanır ve iletişimden çıkma talepleri takip edilir."],"de":["Relevante Kontakte ansprechen","Aus einem geprüften Geschäftskontakt wird eine passende Vorstellung.","Freigegebene Kontakte und Informationen zu deinem Angebot.",["Geschäftskontext lesen","Passende E-Mail entwerfen","Vor Versand prüfen"],"Individuelle E-Mail-Entwürfe und eine Übersicht der Folgeschritte.","Versand erst nach Freigabe über eine autorisierte Integration. Abmeldungen beachten und Kontaktdaten prüfen."],"ru":["Сделать обращения полезными","Подготовка персонального знакомства с подходящей компанией.","Одобренные контакты и описание ваших услуг.",["Изучить контекст","Подготовить письмо","Проверить перед отправкой"],"Персональные черновики писем и журнал последующих действий.","Отправка после одобрения через разрешённую интеграцию. Проверять контакты и учитывать отказы от рассылки."]}},{"id":"support","cat":0,"icon":"support","source":["OpenAI customer service agents demo","https://github.com/openai/openai-cs-agents-demo"],"texts":{"en":["Route support to the right specialist","Help your team handle customer questions with the right context.","A customer request and approved help documents.",["Identify the request","Retrieve relevant guidance","Draft or escalate"],"A grounded reply and a handoff summary.","Account changes need appropriate authorization. The reference uses hosted APIs; local use requires adaptation."],"tr":["Desteği doğru uzmana yönlendir","Müşteri sorularını doğru bilgilerle yanıtlaması için ekibine yardımcı ol.","Müşteri talebi ve onaylı yardım belgeleri.",["Talebi sınıflandır","İlgili bilgileri getir","Yanıt hazırla veya devret"],"Kaynaklara dayanan yanıt ve devir özeti.","Hesap değişiklikleri uygun yetki gerektirir. Kaynak proje bulut API'leri kullanır; yerel kullanım için uyarlama gerekir."],"de":["Support richtig zuordnen","Unterstütze dein Team bei Kundenfragen mit dem passenden Kontext.","Kundenanfrage und freigegebene Hilfedokumente.",["Anfrage einordnen","Passende Hinweise abrufen","Antwort entwerfen oder eskalieren"],"Eine belegte Antwort und eine Übergabezusammenfassung.","Kontoänderungen erfordern Berechtigungen. Das Referenzprojekt nutzt Cloud-APIs; lokale Nutzung erfordert Anpassungen."],"ru":["Направить запрос нужному специалисту","Помощь команде поддержки с учётом контекста клиента.","Запрос клиента и одобренная справочная документация.",["Определить тип запроса","Найти рекомендации","Подготовить ответ или передать"],"Обоснованный ответ и сводка для передачи специалисту.","Изменения аккаунта требуют разрешения. Пример использует облачные API; локальный запуск требует адаптации."]}},{"id":"operations","cat":0,"icon":"chart","source":["Microsoft Magentic-One","https://microsoft.github.io/autogen/dev/user-guide/agentchat-user-guide/magentic-one.html"],"texts":{"en":["Turn scattered reports into next steps","Bring stock, supplier updates, and weekly records into one view.","Selected spreadsheets and supplier documents.",["Extract key records","Check totals and gaps","Prepare an action list"],"An exception report with traceable source records.","An adaptation of a general agent pattern, not a built-in inventory product. Review before changing records or placing orders."],"tr":["Dağınık raporlardan sonraki adımı çıkar","Stok, tedarikçi güncellemeleri ve haftalık kayıtları birlikte değerlendir.","Seçilen tablolar ve tedarikçi belgeleri.",["Gerekli kayıtları çıkar","Toplamları ve eksikleri kontrol et","İş listesi hazırla"],"Kaynak kayıtları izlenebilir bir istisna raporu.","Genel bir ajan yaklaşımının uyarlamasıdır; hazır stok ürünü değildir. Kayıt değişikliği ve sipariş öncesinde inceleme gerekir."],"de":["Aus Berichten nächste Schritte ableiten","Bestände, Lieferantenmeldungen und Wochenberichte zusammenführen.","Ausgewählte Tabellen und Lieferantendokumente.",["Daten extrahieren","Summen und Lücken prüfen","Aufgabenliste erstellen"],"Ein Abweichungsbericht mit nachvollziehbaren Quellen.","Übertragung eines allgemeinen Agentenmusters, keine fertige Lagerverwaltung. Änderungen und Bestellungen vorher prüfen."],"ru":["Превратить отчёты в план действий","Объединить данные о запасах, поставщиках и еженедельных операциях.","Выбранные таблицы и документы поставщиков.",["Извлечь записи","Проверить суммы и пробелы","Подготовить список задач"],"Отчёт об отклонениях со ссылками на исходные записи.","Адаптация общего подхода, не готовая складская система. Проверять изменения и заказы до выполнения."]}},{"id":"research","cat":1,"icon":"research","source":["Local Deep Researcher","https://github.com/langchain-ai/local-deep-researcher"],"texts":{"en":["Research a technical decision","Compare components or investigate a topic without losing the sources.","A research question and trusted source preferences.",["Plan the searches","Investigate missing evidence","Write a sourced brief"],"A comparison with citations and unresolved questions.","Local model inference is possible; web searches are online. Check dates and source quality before making a decision."],"tr":["Teknik kararları araştır","Kaynakları kaybetmeden bileşenleri karşılaştır veya bir konuyu incele.","Araştırma sorusu ve tercih ettiğin güvenilir kaynaklar.",["Aramaları planla","Eksik kanıtları araştır","Kaynaklı özet yaz"],"Atıfları ve açık soruları içeren bir karşılaştırma.","Model yerelde çalışabilir; web aramaları çevrimiçidir. Karar öncesinde tarihleri ve kaynak kalitesini kontrol et."],"de":["Technische Entscheidungen recherchieren","Komponenten vergleichen und Themen mit nachvollziehbaren Quellen untersuchen.","Recherchefrage und bevorzugte vertrauenswürdige Quellen.",["Suche planen","Fehlende Belege recherchieren","Quellenbericht erstellen"],"Ein Vergleich mit Belegen und offenen Fragen.","Lokale Modellinferenz ist möglich; Websuchen sind online. Aktualität und Quellenqualität vor Entscheidungen prüfen."],"ru":["Исследовать техническое решение","Сравнивать компоненты и изучать темы, сохраняя источники.","Вопрос и предпочтительные надёжные источники.",["Спланировать поиск","Найти недостающие сведения","Подготовить обзор с источниками"],"Сравнение со ссылками и нерешёнными вопросами.","Модель может работать локально; веб-поиск требует сети. Проверять актуальность и качество источников."]}},{"id":"coding","cat":1,"icon":"code","source":["OpenHands","https://github.com/OpenHands/OpenHands"],"texts":{"en":["Go from bug report to reviewable fix","Investigate a repository and prepare a focused change with checks.","An issue, repository, and development environment.",["Reproduce the failure","Implement a focused patch","Run checks and show the diff"],"A proposed fix, validation results, and handoff notes.","Review before merge or deployment. Embedded projects also need the correct toolchain and hardware validation."],"tr":["Hata bildiriminden incelenebilir çözüme geç","Depoyu incele, odaklı bir değişiklik hazırla ve kontrollerle destekle.","Hata kaydı, kod deposu ve geliştirme ortamı.",["Hatayı yeniden üret","Odaklı bir düzeltme yap","Kontrolleri çalıştır ve farkı göster"],"Düzeltme önerisi, doğrulama sonuçları ve devir notları.","Birleştirme ve yayın öncesinde inceleme gerekir. Gömülü projelerde doğru araç zinciri ve donanım doğrulaması da gerekir."],"de":["Vom Fehlerbericht zum prüfbaren Fix","Ein Repository untersuchen und eine gezielte Änderung mit Tests vorbereiten.","Fehlerbericht, Repository und Entwicklungsumgebung.",["Fehler reproduzieren","Gezielt korrigieren","Tests und Änderungen zeigen"],"Ein Lösungsvorschlag mit Testergebnissen und Übergabenotizen.","Vor Merge oder Veröffentlichung prüfen. Eingebettete Projekte benötigen passende Toolchains und Hardwaretests."],"ru":["От ошибки к исправлению для ревью","Исследовать репозиторий и подготовить точечное изменение с проверками.","Описание ошибки, репозиторий и среда разработки.",["Воспроизвести ошибку","Внести исправление","Запустить проверки и показать изменения"],"Предлагаемое исправление, результаты проверок и пояснения.","Ревью перед слиянием и развёртыванием. Встраиваемым проектам нужны подходящие инструменты и аппаратные испытания."]}},{"id":"health","cat":2,"icon":"health","texts":{"en":["Bring health trends into clinical review","Explore preventive-care support for consent-based wellness and insurance programs.","Participant-approved measurements and health records.",["Check data quality","Summarize trends","Route findings to a clinician"],"A trend summary, missing-data notes, and a clinical review queue.","Concept only. Disease-risk prediction needs a clinically validated model for the target population. No diagnosis or automated insurance eligibility or pricing decisions."],"tr":["Sağlık eğilimlerini klinik değerlendirmeye taşı","Katılımcı onayına dayanan sağlık ve sigorta programlarında önleyici bakımı destekle.","Katılımcının paylaşımını onayladığı ölçümler ve sağlık kayıtları.",["Veri kalitesini kontrol et","Eğilimleri özetle","Bulguları klinisyene yönlendir"],"Eğilim özeti, eksik veri notları ve klinik değerlendirme sırası.","Yalnızca proje fikridir. Hastalık riski tahmini hedef grupta klinik olarak doğrulanmış model gerektirir. Tanı veya otomatik sigorta uygunluğu ve fiyatlandırma kararı vermez."],"de":["Gesundheitstrends ärztlich prüfen lassen","Vorsorge in Gesundheits- und Versicherungsprogrammen mit Einwilligung unterstützen.","Von Teilnehmenden freigegebene Messwerte und Gesundheitsakten.",["Datenqualität prüfen","Trends zusammenfassen","Ärztliche Prüfung vorbereiten"],"Trendübersicht, Hinweise auf Datenlücken und eine ärztliche Prüfliste.","Nur ein Konzept. Risikoprognosen erfordern ein klinisch validiertes Modell für die Zielgruppe. Keine Diagnosen oder automatisierten Versicherungs- und Preisentscheidungen."],"ru":["Передать тенденции здоровья на врачебную оценку","Поддержка профилактики в оздоровительных и страховых программах с согласия участников.","Измерения и медицинские записи, разрешённые участником.",["Проверить качество данных","Обобщить тенденции","Передать врачу"],"Обзор тенденций, пробелы в данных и очередь врачебной оценки.","Только концепция. Прогноз риска требует клинически проверенной модели для целевой группы. Без диагнозов и автоматических решений о страховании или тарифах."]}}];
